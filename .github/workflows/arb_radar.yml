name: TFEX Real-time 1-Minute Arbitrage Radar

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Trading Session to scan (MORNING_WORKER, AFTERNOON_WORKER, MIDDAY, or EVENING)'
        required: true
        default: 'MORNING_WORKER'
        type: choice
        options:
          - MORNING_WORKER
          - AFTERNOON_WORKER
          - MIDDAY
          - EVENING

jobs:
  run-arbitrage-radar:
    name: TFEX Arbitrage Radar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Session Target
        id: sess
        run: |
          TARGET_SESSION="${{ github.event.inputs.session }}"
          if [ -z "$TARGET_SESSION" ]; then
            echo "::error::[STRICT VALIDATION] 'session' input is required but was not provided or is empty."
            exit 1
          fi
          # Normalize to uppercase
          TARGET_SESSION=$(echo "$TARGET_SESSION" | tr '[:lower:]' '[:upper:]')
          if [ "$TARGET_SESSION" != "MIDDAY" ] && [ "$TARGET_SESSION" != "EVENING" ] && [ "$TARGET_SESSION" != "MORNING_WORKER" ] && [ "$TARGET_SESSION" != "AFTERNOON_WORKER" ]; then
            echo "::error::[STRICT VALIDATION] Invalid session '$TARGET_SESSION'. Must be one of: MIDDAY, EVENING, MORNING_WORKER, AFTERNOON_WORKER."
            exit 1
          fi
          echo "target_session=$TARGET_SESSION" >> $GITHUB_OUTPUT

      - name: Execute Arbitrage Scanner
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SETTRADE_APP_ID: ${{ secrets.SETTRADE_APP_ID }}
          SETTRADE_APP_SECRET: ${{ secrets.SETTRADE_APP_SECRET }}
          SETTRADE_BROKER_ID: ${{ secrets.SETTRADE_BROKER_ID }}
          SETTRADE_APP_CODE: ${{ secrets.SETTRADE_APP_CODE }}
          SETTRADE_IS_SANDBOX: ${{ secrets.SETTRADE_IS_SANDBOX }}
        run: |
          echo "Scanning TFEX Intraday Arbitrage for Session: ${{ steps.sess.outputs.target_session }}"
          python arb_scanner.py --session ${{ steps.sess.outputs.target_session }}
