name: TFEX Intraday Arbitrage Radar

on:
  schedule:
    # Morning Session Worker (09:45 - 12:36 BKK):
    # Primary trigger: 09:45 BKK (02:45 UTC)
    - cron: '45 2 * * 1-5'
    # Backup trigger:  10:00 BKK (03:00 UTC) - backup if primary runner was queued/delayed
    - cron: '0 3 * * 1-5'
    # Afternoon Session Worker (14:10 - 17:06 BKK):
    # Primary trigger: 14:10 BKK (07:10 UTC)
    - cron: '10 7 * * 1-5'
    # Backup trigger:  14:25 BKK (07:25 UTC) - backup if primary runner was queued/delayed
    - cron: '25 7 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'Trading Session to scan (MORNING_WORKER, AFTERNOON_WORKER, MIDDAY, or EVENING)'
        required: true
        default: 'MORNING_WORKER'
        type: choice
        options:
          - MORNING_WORKER
          - AFTERNOON_WORKER
          - MIDDAY
          - EVENING

jobs:
  run-arbitrage-radar:
    name: TFEX Arbitrage Radar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Session Target
        id: sess
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_session=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "45 2 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 3 * * 1-5" ]; then
            echo "target_session=MORNING_WORKER" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "10 7 * * 1-5" ] || [ "${{ github.event.schedule }}" = "25 7 * * 1-5" ]; then
            echo "target_session=AFTERNOON_WORKER" >> $GITHUB_OUTPUT
          else
            echo "target_session=EVENING" >> $GITHUB_OUTPUT
          fi

      - name: Execute Arbitrage Scanner
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Scanning TFEX Intraday Arbitrage for Session: ${{ steps.sess.outputs.target_session }}"
          python arb_scanner.py --session ${{ steps.sess.outputs.target_session }}
